# Google Play için imzalı AAB üretir. Gerekli Secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD.
name: Android AAB
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Capacitor kurulumu
        run: |
          npm install @capacitor/core @capacitor/android @capacitor/cli @capacitor/assets
          npx cap add android
          node tools/patch-android.js
          npx capacitor-assets generate --android
          npx cap sync android
      - name: Anahtar deposunu hazırla
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
          cat >> android/app/build.gradle <<'EOF'
          android.signingConfigs {
            release {
              storeFile file('release.keystore')
              storePassword System.getenv('KEYSTORE_PASSWORD')
              keyAlias System.getenv('KEY_ALIAS')
              keyPassword System.getenv('KEY_PASSWORD')
            }
          }
          android.buildTypes.release.signingConfig = android.signingConfigs.release
          EOF
      - name: AAB derle
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: ors-dukkani-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
