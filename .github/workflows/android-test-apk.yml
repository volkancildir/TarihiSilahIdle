name: Android Test APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Capacitor kurulumu
        run: |
          npm install @capacitor/core @capacitor/android @capacitor/cli @capacitor/assets
          npx cap add android
          node tools/patch-android.js
          npx capacitor-assets generate --android
          npx cap sync android
      - name: Test APK derle (imzalama anahtarı gerekmez)
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ors-dukkani-test-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
