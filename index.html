<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#172a2c">
<title>Demirci Ustası</title>
<style>
:root{color-scheme:dark;--panel:#20372d;--gold:#f3c66d;--cream:#fff1d0}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#172a24;color:var(--cream);font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}#game{position:relative;width:100%;height:100dvh;overflow:hidden}canvas{position:absolute;inset:0;width:100%;height:100%;display:block}.hud{position:absolute;z-index:2;top:0;left:0;right:0;padding:calc(12px + env(safe-area-inset-top)) 14px 0;pointer-events:none;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.brand{font-size:clamp(22px,5vw,32px);font-weight:950;text-shadow:0 3px 5px #17251d;line-height:1.1}.sub{font-size:15px;font-weight:750;color:#d8e8c9;margin-top:5px}.coins{font-size:clamp(18px,4.5vw,25px);font-weight:900;background:#20372df2;border:2px solid #f3d99c;border-radius:14px;padding:10px 13px;white-space:nowrap;box-shadow:0 4px 0 #14231b}.hint{position:absolute;z-index:2;top:calc(104px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:max-content;max-width:92%;text-align:center;padding:12px 16px;background:#20372df2;border:2px solid #dfc78c;border-radius:15px;font-size:clamp(16px,4vw,21px);font-weight:850;box-shadow:0 4px 0 #14231b}.controls{position:absolute;z-index:3;left:0;right:0;bottom:calc(15px + env(safe-area-inset-bottom));display:flex;align-items:flex-end;justify-content:space-between;padding:0 15px;pointer-events:none}.joy{width:min(34vw,155px);height:min(34vw,155px);min-width:112px;min-height:112px;position:relative;border-radius:50%;border:3px solid #f3dfab;background:radial-gradient(circle at 30% 25%,#647e5c,#263e30 70%);box-shadow:inset 0 0 0 7px #ffffff16,0 6px 14px #10201899;pointer-events:auto;touch-action:none}.stick{position:absolute;left:50%;top:50%;width:42%;height:42%;transform:translate(-50%,-50%);border-radius:50%;border:3px solid #fff0c9;background:linear-gradient(145deg,#f5edc9,#9ac58a);box-shadow:0 4px 0 #17271f}.status{max-width:55%;min-width:145px;padding:13px 15px;border:2px solid #f3d99c;border-radius:16px;background:#20372df2;font-size:clamp(15px,3.8vw,19px);font-weight:850;text-align:center;box-shadow:0 4px 0 #14231b}.status small{display:block;color:#d5e5c8;font-size:13px;margin-top:4px}.toast{position:absolute;z-index:4;left:50%;top:50%;transform:translate(-50%,-50%);padding:16px 20px;border-radius:16px;background:#fff0c9;color:#27372b;font-size:22px;font-weight:950;box-shadow:0 5px 0 #927448;opacity:0;pointer-events:none;transition:opacity .2s}.toast.show{opacity:1}@media(min-width:700px){.joy{width:150px;height:150px}.hud{padding-left:25px;padding-right:25px}}
</style>
</head>
<body>
<div id="game">
<canvas id="world" aria-label="Demirci atölyesi oyun alanı"></canvas>
<div class="hud"><div><div class="brand">⚒️ Demirci Ustası</div><div class="sub">Kılıcı döv · Müşteriye teslim et</div></div><div class="coins" id="coins">🪙 0 akçe</div></div>
<div class="hint" id="hint">Arkada ocağa yürü; kılıç otomatik dövülsün!</div>
<div class="controls"><div class="joy" id="joy"><div class="stick" id="stick"></div></div><div class="status" id="status">⚒️ Ocağa git<small>Yaklaşınca otomatik dövülür</small></div></div>
<div class="toast" id="toast"></div>
</div>
<script>
(()=>{
const canvas=document.getElementById('world'),ctx=canvas.getContext('2d'),$=id=>document.getElementById(id);
const W=1000,H=700;let cw=0,ch=0,scale=1,joy={x:0,y:0},pointer=null,last=0,walk=0,facing=1,coins=0,stock=0,phase='forge',forgingUntil=0,toastUntil=0,toastText='',saved=false;
let x=650,y=540;
function resize(){const dpr=Math.min(devicePixelRatio||1,2);cw=innerWidth;ch=innerHeight;canvas.width=Math.round(cw*dpr);canvas.height=Math.round(ch*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);scale=Math.min(cw/760,ch/560);scale=Math.max(.55,Math.min(1.25,scale))}
addEventListener('resize',resize);resize();
function round(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function ellipse(x,y,rx,ry,color){ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}
function line(x1,y1,x2,y2,color,w){ctx.strokeStyle=color;ctx.lineWidth=w;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function text(t,x,y,size,color,align='center'){ctx.fillStyle=color;ctx.font='900 '+size+'px system-ui';ctx.textAlign=align;ctx.fillText(t,x,y)}
function drawForge(){ellipse(420,438,104,26,'#1b3027aa');round(340,360,160,74,15,'#6a5540');round(356,340,128,48,12,'#8e7150');round(371,305,98,47,12,'#3a3931');round(382,316,76,25,8,'#ed8a35');ellipse(420,326,35,14,'#ffbd4c');ellipse(420,323,20,9,'#fff0a0');for(let i=0;i<5;i++)line(363+i*26,370,363+i*26,421,'#b38b5c',5);round(385,430,70,11,4,'#c3a06b');text('DEMİRCİ OCAĞI',420,474,16,'#fff0c9');if(phase==='forge'){line(420,289,420,267,'#fff0a0',5);ellipse(420,258,8,13,'#ffbd4c')}}
function drawCustomer(){ellipse(750,510,48,14,'#1b3027aa');round(725,468,50,45,11,'#3b6470');round(719,478,13,31,6,'#d0a66b');round(767,478,13,31,6,'#d0a66b');ellipse(750,451,24,26,'#c98d5d');ellipse(750,432,28,12,'#4b3528');round(723,426,54,12,5,'#65452c');line(739,450,744,451,'#322820',3);line(756,451,761,451,'#322820',3);line(741,462,759,462,'#6d322a',3);text('MÜŞTERİ',750,548,20,'#fff0c9');round(705,557,90,12,5,'#694a2e');round(715,560,70,6,3,'#b78b51')}
function drawPlayer(px,py){ellipse(px,py+16,21,8,'#14281e66');const bob=Math.sin(walk*10)*2;round(px-13,py-27+bob,26,34,8,'#8a3e35');round(px-11,py-5+bob,9,23,4,'#493c30');round(px+2,py-5+bob,9,23,4,'#493c30');ellipse(px,py-35+bob,13,14,'#d7a16d');round(px-14,py-46+bob,28,9,4,'#43342b');if(phase==='deliver'&&stock>0){line(px+facing*12,py-24,px+facing*38,py-39,'#d7b87b',5);line(px+facing*38,py-39,px+facing*57,py-47,'#e8e9df',5)}}
function drawWorld(){ctx.clearRect(0,0,cw,ch);const viewW=cw/scale,viewH=ch/scale;const camX=Math.max(0,Math.min(W-viewW,x-viewW/2)),camY=Math.max(0,Math.min(H-viewH,y-viewH/2));ctx.save();ctx.scale(scale,scale);ctx.translate(-camX,-camY);
let g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,'#7aa65e');g.addColorStop(1,'#3c7043');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
for(let i=0;i<180;i++){const gx=(i*137+21)%W,gy=(i*89+31)%H;ellipse(gx,gy,8+(i%4)*3,3+(i%3),i%2?'#b8cf7733':'#204e302b')}

ctx.save();ctx.translate(80,-110);drawForge();ctx.restore();ctx.save();ctx.translate(-250,0);ctx.translate(750,500);ctx.scale(.72,.72);ctx.translate(-750,-500);drawCustomer();ctx.restore();drawPlayer(x,y);
if(phase==='forge'&&Math.hypot(x-500,y-300)<90){text('🔥',500,190,26,'#fff0a0')}
ctx.restore()}
function showToast(t){toastText=t;$('toast').textContent=t;$('toast').classList.add('show');toastUntil=performance.now()+1400}
function updateUI(){ $('coins').textContent='🪙 '+coins+' akçe';if(phase==='forge'){$('hint').textContent='Ocağa yürü, kılıcı otomatik döv!';$('status').innerHTML='⚒️ Ocağa git<small>Yaklaşınca otomatik dövülür</small>'}else{$('hint').textContent='Öndeki müşteriye götür; otomatik teslim et!';$('status').innerHTML='📦 Müşteriye git<small>Yaklaşınca otomatik teslim edilir</small>'}}
function auto(){if(phase==='forge'&&Math.hypot(x-500,y-300)<88&&performance.now()>forgingUntil){forgingUntil=performance.now()+2200;stock++;phase='deliver';showToast('⚒️ Kılıç dövüldü!');updateUI()}if(phase==='deliver'&&stock>0&&Math.hypot(x-500,y-500)<78){stock--;coins+=10;phase='forge';showToast('🪙 Kılıç teslim edildi! +10 akçe');updateUI()}}
function frame(ts){const dt=Math.min(.04,(ts-last)/1000||0);last=ts;const len=Math.hypot(joy.x,joy.y);if(len>.05){x=Math.max(35,Math.min(W-35,x+joy.x*220*dt));y=Math.max(185,Math.min(H-30,y+joy.y*220*dt));walk+=dt;if(Math.abs(joy.x)>.08)facing=joy.x>0?1:-1}auto();drawWorld();if(ts>toastUntil)$('toast').classList.remove('show');requestAnimationFrame(frame)}
const joyEl=$('joy');function move(e){const r=joyEl.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),max=r.width*.32,len=Math.hypot(dx,dy),k=len>max?max/len:1;joy.x=dx*k/max;joy.y=dy*k/max;$('stick').style.transform='translate(calc(-50% + '+dx*k+'px),calc(-50% + '+dy*k+'px))'}
joyEl.addEventListener('pointerdown',e=>{pointer=e.pointerId;joyEl.setPointerCapture(pointer);move(e)});joyEl.addEventListener('pointermove',e=>{if(e.pointerId===pointer)move(e)});function end(e){if(e.pointerId!==pointer)return;pointer=null;joy.x=joy.y=0;$('stick').style.transform='translate(-50%,-50%)'}joyEl.addEventListener('pointerup',end);joyEl.addEventListener('pointercancel',end);
addEventListener('keydown',e=>{if(e.key==='ArrowUp'||e.key==='w')joy.y=-1;if(e.key==='ArrowDown'||e.key==='s')joy.y=1;if(e.key==='ArrowLeft'||e.key==='a')joy.x=-1;if(e.key==='ArrowRight'||e.key==='d')joy.x=1});addEventListener('keyup',e=>{if(['ArrowUp','ArrowDown','w','s'].includes(e.key))joy.y=0;if(['ArrowLeft','ArrowRight','a','d'].includes(e.key))joy.x=0});
updateUI();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
