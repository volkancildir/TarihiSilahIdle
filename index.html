<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Örs Dükkanı</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@700;800&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#141b24;--panel:#1b2530;--panel-2:#233140;--line:#2f4053;--ink:#e8edf3;--ink-dim:#9fadbd;--brass:#e2a93b;--brass-ink:#241706;--ok:#7cc680;--bad:#e8715f;--font-display:'Alegreya SC',Georgia,'Times New Roman',serif;--font-body:'Alegreya Sans',system-ui,-apple-system,'Segoe UI',sans-serif;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:17px/1.45 var(--font-body);margin:0;padding-block:12px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.game{max-width:1060px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font:800 32px/1.05 var(--font-display);letter-spacing:.02em;margin:0;text-wrap:balance}
.purse{display:flex;align-items:baseline;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 16px 7px 12px}
.purse .coin{width:20px;height:20px;align-self:center}
.gold{font:700 28px/1 var(--font-body);font-variant-numeric:tabular-nums}
.rate{font-size:14px;color:var(--ink-dim);font-variant-numeric:tabular-nums}
.layout{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.layout{grid-template-columns:minmax(0,620px) minmax(0,1fr);align-items:start}}
.stage{min-width:0}.frame{position:relative}
#cv{display:block;width:100%;aspect-ratio:1/1;max-width:100%;border-radius:10px;border:1px solid var(--line);background:#2b2723;touch-action:manipulation;cursor:pointer}
.toast{position:absolute;left:10px;right:10px;top:10px;background:rgba(20,27,36,.94);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:15px}
.hint{margin:10px 0 0;min-height:2.8em;color:var(--ink);font-size:17px;font-weight:500;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.stats{display:flex;flex-wrap:wrap;gap:8px 18px;margin:10px 0 0;font-size:15px;color:var(--ink-dim)}
.stats div{display:flex;gap:6px}.stats dt{margin:0}.stats dd{margin:0;color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.shop{min-width:0;display:flex;flex-direction:column;gap:14px}
.shop h2{font:700 20px/1 var(--font-display);letter-spacing:.07em;color:var(--ink-dim);margin:0 0 8px}
.group{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 14px;border-top:1px solid var(--line)}.row:first-child{border-top:0}
.name{font-weight:700;font-size:18px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}.lv{font-size:13px;font-weight:500;color:var(--ink-dim);font-variant-numeric:tabular-nums}
.sub{font-size:15px;color:var(--ink-dim);line-height:1.35;margin-top:2px}
.buy{min-width:98px;min-height:44px;padding:0 12px;border-radius:8px;border:1px solid transparent;background:var(--brass);color:var(--brass-ink);font:700 16px var(--font-body);display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;font-variant-numeric:tabular-nums}
.buy .coin{width:15px;height:15px}.buy:not(:disabled):active{transform:translateY(1px)}
.buy:disabled{background:var(--panel-2);color:var(--ink-dim);border-color:var(--line);cursor:not-allowed}.buy.max{background:transparent;color:var(--ok);border-color:transparent}
button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.foot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--ink-dim);font-size:14px}
.ghost{background:transparent;color:var(--ink-dim);border:1px solid var(--line);border-radius:8px;min-height:40px;padding:0 14px;font:500 14px var(--font-body);cursor:pointer}.ghost.warn{color:var(--bad);border-color:var(--bad)}
@media (prefers-reduced-motion:reduce){.buy{transition:none}}
</style>
</head>
<body>
<main class="game">
<header class="top"><h1>Örs Dükkanı</h1><div class="purse"><svg class="coin" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="#e2a93b" stroke="#9a6a14"/><circle cx="8" cy="8" r="4.2" fill="none" stroke="#9a6a14" stroke-width="1.2"/></svg><span id="gold" class="gold">0</span><span id="rate" class="rate"></span></div></header>

</main>

const toastEl=document.getElementById('toast');let toastTimer=0;
function toast(msg){toastEl.textContent=msg;toastEl.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{toastEl.hidden=true},6000)}
function applyOffline(sec){if(sec>30&&G.rate>0){const gain=Math.floor(G.rate*.6*Math.min(sec,7200));if(gain>0){G.gold+=gain;G.total+=gain;toast('Sen yokken dükkan '+fmt(gain)+' altın kazandı.')}}}
document.addEventListener('visibilitychange',()=>{if(document.hidden){hiddenAt=Date.now();save()}else if(hiddenAt){applyOffline((Date.now()-hiddenAt)/1000);hiddenAt=0}});window.addEventListener('pagehide',save);
const shopEl=document.getElementById('shop'),goldEl=document.getElementById('gold'),rateEl=document.getElementById('rate'),stServed=document.getElementById('st-served'),stLost=document.getElementById('st-lost'),stTotal=document.getElementById('st-total'),rows={};
function buildShop(){GROUPS.forEach(gr=>{const sec=document.createElement('div'),h=document.createElement('h2');h.textContent=gr[0];sec.appendChild(h);const box=document.createElement('div');box.className='group';gr[1].forEach(id=>{const u=UPG.find(x=>x.id===id),row=document.createElement('div');row.className='row';const left=document.createElement('div'),nm=document.createElement('div');nm.className='name';const t=document.createElement('span');t.textContent=u.name;const lv=document.createElement('span');lv.className='lv';nm.append(t,lv);const sub=document.createElement('div');sub.className='sub';left.append(nm,sub);const b=document.createElement('button');b.type='button';b.className='buy';b.id='buy-'+id;b.addEventListener('click',()=>buy(id));row.append(left,b);box.appendChild(row);rows[id]={u,lv,sub,btn:b}});sec.appendChild(box);shopEl.appendChild(sec)})}
function buy(id){const u=rows[id].u,l=G.lv[id];if(l>=u.max)return;const c=cost(u,l);if(G.gold<c)return;G.gold-=c;G.lv[id]=l+1;if(id==='smith'||id==='carrier')syncWorkers(true);updateUI();save()}
function updateUI(){goldEl.textContent=fmt(G.gold);rateEl.textContent='+'+curRate().toFixed(1).replace('.',',')+'/sn';stServed.textContent=fmt(G.served);stLost.textContent=fmt(G.lost);stTotal.textContent=fmt(G.total);UPG.forEach(u=>{const r=rows[u.id];if(!r)return;const l=G.lv[u.id],maxed=l>=u.max;r.lv.textContent=l+'/'+u.max;r.sub.textContent=u.text(l);if(maxed){r.btn.className='buy max';r.btn.disabled=true;r.btn.textContent='Tamam'}else{const c=cost(u,l);r.btn.className='buy';r.btn.disabled=G.gold<c;const html=COIN+'<span>'+fmt(c)+'</span>';if(r.btn.dataset.h!==html){r.btn.innerHTML=html;r.btn.dataset.h=html}}if(maxed)delete r.btn.dataset.h})}
const resetBtn=document.getElementById('reset'),askEl=document.getElementById('reset-ask');
resetBtn.addEventListener('click',()=>{askEl.hidden=false;resetBtn.hidden=true});document.getElementById('reset-no').addEventListener('click',()=>{askEl.hidden=true;resetBtn.hidden=false});document.getElementById('reset-yes').addEventListener('click',()=>{try{localStorage.removeItem(KEY)}catch(e){}G=freshG();resetWorld();updateUI();askEl.hidden=true;resetBtn.hidden=false;save()});
let lastFrame=0;
function frame(now){let dt=(now-lastFrame)/1000;lastFrame=now;if(!(dt>0))dt=0;if(dt>.1)dt=.1;update(dt);render();requestAnimationFrame(frame)}
function start(d){let g=null;if(d&&typeof d.gold==='number')g=merge(d);if(!g)g=loadSave();if(g){G=g;applyOffline((Date.now()-G.last)/1000)}buildShop();resetWorld();updateUI();updateHint();resize();setInterval(updateUI,150);try{if(window.claude&&window.claude.hot&&window.claude.hot.snapshot)window.claude.hot.snapshot(()=>JSON.parse(JSON.stringify(G)))}catch(e){}requestAnimationFrame(t=>{lastFrame=t;requestAnimationFrame(frame)})}
const hot=window.claude&&window.claude.hot;if(hot&&hot.ready)hot.ready(start);else start(hot&&hot.data);
})();
</script>
</body>
</html>
